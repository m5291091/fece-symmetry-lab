[server]
address = "127.0.0.1"
enableCORS = true
enableXsrfProtection = true
maxUploadSize = 10
enableStaticServing = false
disconnectedSessionTTL = 30

[browser]
serverAddress = "localhost"
gatherUsageStats = false

[client]
showErrorDetails = "none"
toolbarMode = "minimal"

[theme]
baseRadius = "medium"
buttonRadius = "full"
showWidgetBorder = true
