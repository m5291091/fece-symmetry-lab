[server]
address = "127.0.0.1"
enableCORS = true
enableXsrfProtection = true
maxUploadSize = 10
enableStaticServing = false
disconnectedSessionTTL = 30

[browser]
serverAddress = "localhost"
gatherUsageStats = false

[client]
showErrorDetails = "none"
toolbarMode = "minimal"

[theme]
base = "dark"
primaryColor = "#38BDF8"
backgroundColor = "#07111F"
secondaryBackgroundColor = "#111C2E"
textColor = "#F8FAFC"
baseRadius = "medium"
buttonRadius = "full"
showWidgetBorder = true
