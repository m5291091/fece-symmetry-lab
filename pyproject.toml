[project]
name = "face-symmetry-lab"
version = "0.1.0"
description = "Local-first face symmetry, skin-surface, and demographic research app"
readme = "README.md"
authors = [
    { name = "Kenjo Yamamoto", email = "applem3ky@gmail.com" }
]
requires-python = ">=3.13,<3.14"
dependencies = [
    "mediapipe>=0.10.35,<0.11",
    "numpy>=2.5.1,<3",
    "opencv-contrib-python>=5.0.0.93,<5.1",
    "pandas>=3.0.3,<4",
    "pillow>=12.3.0,<13",
    "pydantic>=2.13.4,<3",
    "streamlit>=1.59.1,<2",
    "streamlit-webrtc>=0.75.0,<0.76",
]

[project.scripts]
face-symmetry-lab = "face_symmetry_lab:main"

[build-system]
requires = ["uv_build>=0.11.26,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.2.0,<3",
    "pytest>=9.1.1,<10",
    "pytest-cov>=7.1.0,<8",
    "ruff>=0.15.20,<1",
]

[tool.ruff]
line-length = 100
target-version = "py313"
# research/ の notebook は測定手順の再現性の正本であり、アプリの runtime ではない。
# ruff は v0.6 以降 *.ipynb を既定の探索対象に含めるが、notebook を本体と同じ規約
# （行長・import 順・B/SIM/N/RUF）へ合わせると、Colab で実行した記録そのものが
# 書き換わって再現性が崩れる。lint と format の対象から外す。
extend-exclude = ["*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N", "RUF"]
# "−" (MINUS SIGN) は §9.5 の分散式（例: Σx²/n − mean²）で数式として使う。
# tests/domain/test_reference_stats.py と tests/repository/test_build_reference_dataset.py
# の docstring/comment がすでにこの文字を使っており、変更できないテストの正本である。
allowed-confusables = ["×", "（", "）", "：", "−"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["cv2.*", "mediapipe.*", "streamlit_webrtc.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "model: fixed real-model test",
    "e2e: browser or media-track integration",
    "performance: reference-device benchmark",
]
