[project]
name = "face-symmetry-lab"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Kenjo Yamamoto", email = "applem3ky@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "insightface>=1.0.1",
    "mediapipe>=0.10.35",
    "numpy>=2.5.1",
    "onnxruntime>=1.27.0",
    "opencv-contrib-python>=5.0.0.93",
    "pandas>=3.0.3",
    "pillow>=12.3.0",
    "pydantic>=2.13.4",
    "pytest>=9.1.1",
    "streamlit>=1.59.1",
    "streamlit-webrtc>=0.75.0",
]

[project.scripts]
face-symmetry-lab = "face_symmetry_lab:main"

[build-system]
requires = ["uv_build>=0.11.26,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.2.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.20",
]
